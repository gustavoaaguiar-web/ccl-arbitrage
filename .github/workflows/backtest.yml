name: GG Backtest Ruta A

on:
  workflow_dispatch:
    inputs:
      solo:
        description: 'SÃ­mbolos separados por coma (ej: GGAL o GGAL,YPFD). VacÃ­o = universo completo (19)'
        required: false
        default: 'GGAL'
      desde:
        description: 'Fecha inicio YYYY-MM-DD'
        required: false
        default: '2024-01-01'
      hasta:
        description: 'Fecha fin YYYY-MM-DD'
        required: false
        default: '2024-02-01'
      dolarizar:
        description: 'Dolarizar Merval vÃ­a CCL antes de backtestear (no afecta CEDEARs)'
        required: false
        type: boolean
        default: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install \
            requests \
            numpy \
            gspread \
            google-auth \
            pytz \
            yfinance

      - name: Run backtest
        env:
          IOL_USER:            ${{ secrets.IOL_USER }}
          IOL_PASS:            ${{ secrets.IOL_PASS }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          ALPACA_KEY_ID:     ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET }}
        run: |
          ARGS="--desde ${{ github.event.inputs.desde }} --hasta ${{ github.event.inputs.hasta }}"
          if [ -n "${{ github.event.inputs.solo }}" ]; then
            ARGS="$ARGS --solo ${{ github.event.inputs.solo }}"
          fi
          if [ "${{ github.event.inputs.dolarizar }}" = "true" ]; then
            ARGS="$ARGS --dolarizar"
          fi
          python run_backtest.py $ARGS
